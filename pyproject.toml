[project]
name = "ai-team-2-0"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "load-dotenv>=0.1.0",
    "path>=17.1.1",
]

[project.scripts]
